<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080706">
<title>Supremz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080706; --bg2: #0f0e0c; --panel: #11100e; --line: rgba(214,186,130,.16); --line2: rgba(214,186,130,.32);
    --text: #f3ede2; --muted: #a49d8f; --dim: #6e685d;
    --gold: #d6ba7e; --gold-rgb: 214,186,126;
    --gold-grad: linear-gradient(135deg, #f6e7bd 0%, #d8b670 32%, #a37b3a 58%, #e9d29a 82%, #c9a35e 100%);
    --accent: var(--gold); --accent-rgb: var(--gold-rgb); --glow-rgb: 214,186,126; --hdr-rgb: 214,186,126;
    --serif: 'Cormorant Garamond', 'Times New Roman', serif; --sans: 'Jost', system-ui, sans-serif;
    --ease: cubic-bezier(.22,1,.36,1);
    --top: 84px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; font-size: 14px; letter-spacing: .01em; overflow: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a[href]:hover { color: var(--gold); }
  button { font: inherit; color: inherit; letter-spacing: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; color: inherit; }
  img { display: block; }
  ::selection { background: rgba(var(--gold-rgb), .35); }
  .scroll { scrollbar-width: thin; scrollbar-color: rgba(var(--gold-rgb), .25) transparent; }
  .i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .i .f { fill: currentColor; stroke: none; }
  .gold-text { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: background 1.6s var(--ease);
    background:
      radial-gradient(70% 55% at 50% -15%, rgba(var(--glow-rgb), .13), transparent 70%),
      radial-gradient(50% 40% at 100% 100%, rgba(var(--gold-rgb), .05), transparent 70%); }

  /* ---------- Top bar ---------- */
  .top { position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: var(--top); display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 40px;
    background: linear-gradient(180deg, rgba(8,7,6,.96), rgba(8,7,6,.7) 70%, rgba(8,7,6,0)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    -webkit-mask-image: linear-gradient(180deg, #000 75%, transparent); mask-image: linear-gradient(180deg, #000 75%, transparent); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand:hover { color: inherit !important; }
  .brand svg { width: 38px; height: 38px; }
  .wm { font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: .42em; margin-right: -.42em; }
  .pv { font-size: 9.5px; font-weight: 500; letter-spacing: .38em; text-transform: uppercase; color: var(--gold); border-left: 1px solid var(--line2); padding-left: 14px; }
  .seg { position: fixed; z-index: 21; top: calc(var(--top) / 2); left: 50%; transform: translate(-50%, -50%); display: flex; gap: 6px; }
  .seg a { position: relative; display: flex; align-items: center; gap: 9px; padding: 10px 18px; color: var(--muted); font-weight: 500; font-size: 11.5px; letter-spacing: .26em; text-transform: uppercase; transition: color .3s; }
  .seg a:hover { color: var(--text); }
  .seg a::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 5px; height: 5px; background: var(--gold); transform: translateX(-50%) rotate(45deg) scale(0); transition: transform .35s var(--ease); }
  .seg a.active { color: var(--gold); }
  .seg a.active::after { transform: translateX(-50%) rotate(45deg) scale(1); }
  .seg .i { width: 16px; height: 16px; }
  .top-r { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: var(--panel); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 18px; color: var(--gold); box-shadow: 0 0 0 1px var(--line2), 0 0 0 4px var(--bg), 0 0 0 5px var(--line); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .ghost-round { width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--text); border: 1px solid var(--line2); transition: border-color .3s, color .3s; }
  .ghost-round:hover { color: var(--gold); border-color: var(--gold); }
  .ghost-round .i { width: 17px; height: 17px; }

  /* ---------- Main ---------- */
  .main { position: relative; z-index: 1; height: 100dvh; overflow-y: auto; overflow-x: hidden; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: calc(var(--top) + 30px) 48px 190px; }
  .eyebrow { font-size: 10.5px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
  .display { font-family: var(--serif); font-weight: 300; font-size: clamp(46px, 7vw, 92px); line-height: .98; letter-spacing: -.01em; margin: 16px 0 0; }
  .display em { font-style: italic; font-weight: 400; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .06em; }
  .rule { display: flex; align-items: center; gap: 14px; color: var(--gold); margin-top: 26px; }
  .rule::before, .rule::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--line2)); }
  .rule::after { background: linear-gradient(90deg, var(--line2), transparent); }
  .rule i { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .sec { margin-top: 84px; }
  .sec-h { display: flex; align-items: flex-end; gap: 22px; margin-bottom: 30px; }
  .sec-h .num { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--gold); min-width: 30px; padding-bottom: 6px; }
  .sec-h h2 { font-family: var(--serif); font-weight: 300; font-size: 40px; line-height: 1; letter-spacing: -.005em; white-space: nowrap; }
  .sec-h .ln { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); margin-bottom: 9px; }
  .sec-h > span:not(.num) { color: var(--muted); font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; padding-bottom: 6px; white-space: nowrap; }

  /* quick access */
  .quick { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 38px; }
  .qk { display: flex; align-items: center; gap: 12px; padding: 5px 22px 5px 5px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; letter-spacing: .04em; transition: border-color .3s, background .3s, color .3s; max-width: 300px; }
  .qk:hover { border-color: var(--line2); background: rgba(var(--gold-rgb), .04); color: var(--text) !important; }
  .qk .cv { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line2); }
  .qk span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qk.playing { border-color: var(--gold); color: var(--gold); }

  .cv { background: linear-gradient(135deg, #1c1915, #0e0d0b); display: flex; align-items: center; justify-content: center; color: var(--dim); overflow: hidden; flex-shrink: 0; object-fit: cover; }
  .cv .i { width: 34%; height: 34%; }
  .liked-cv { background: radial-gradient(circle at 30% 25%, #2a2215, #0d0b08 75%); color: var(--gold); }
  .liked-cv .i { stroke-width: 1.1; }

  /* tiles: framed like artwork */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 40px 26px; }
  .tiles.row { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 188px; overflow-x: auto; padding: 6px 6px 16px; margin: -6px -6px 0; scroll-snap-type: x proximity; scrollbar-width: none; }
  .tiles.row::-webkit-scrollbar { display: none; }
  .tile { cursor: pointer; min-width: 0; scroll-snap-align: start; }
  .tile-art { position: relative; aspect-ratio: 1; margin-bottom: 16px; padding: 7px; background: linear-gradient(160deg, #15130f, #0b0a08); border: 1px solid var(--line); transition: transform .5s var(--ease), border-color .4s, box-shadow .5s var(--ease); }
  .tile-art .cv { width: 100%; height: 100%; }
  .tile.round .tile-art { border-radius: 50%; }
  .tile.round .tile-art .cv { border-radius: 50%; }
  .tile:hover .tile-art { transform: translateY(-5px); border-color: var(--line2); box-shadow: 0 30px 50px -26px rgba(0,0,0,.95), 0 0 40px -20px rgba(var(--gold-rgb), .35); }
  .tile-play { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--gold-grad); color: #1a1408; box-shadow: 0 10px 30px rgba(0,0,0,.6);
    opacity: 0; transform: scale(.8); transition: opacity .3s var(--ease), transform .3s var(--ease); }
  .tile-play .i { width: 19px; height: 19px; }
  .tile:hover .tile-play, .tile-play.is-on { opacity: 1; transform: none; }
  .tile-nm { font-family: var(--serif); font-size: 19px; font-weight: 500; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-sub { color: var(--muted); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.round { text-align: center; }

  /* ---------- Turntable deck ---------- */
  .deck { --s: 240px; position: relative; width: calc(var(--s) * 1.52); height: var(--s); flex-shrink: 0; }
  .sleeve { position: absolute; z-index: 3; left: 0; top: 0; width: var(--s); height: var(--s); overflow: hidden; box-shadow: 0 40px 70px -26px rgba(0,0,0,.95), 0 0 0 1px rgba(var(--gold-rgb), .22); }
  .sleeve::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.12), transparent 35%); pointer-events: none; }
  .sleeve .cv { width: 100%; height: 100%; }
  .disc-wrap { position: absolute; z-index: 1; top: calc(var(--s) * .04); left: 0; width: calc(var(--s) * .92); height: calc(var(--s) * .92); transition: transform 1.2s var(--ease); transform: translateX(calc(var(--s) * .14)); }
  body.is-playing .disc-wrap { transform: translateX(calc(var(--s) * .5)); }
  .disc { width: 100%; height: 100%; border-radius: 50%; position: relative; animation: spin 5.5s linear infinite; animation-play-state: paused;
    background: radial-gradient(circle, transparent 34%, rgba(var(--gold-rgb), .35) 34.3%, transparent 35.2%), repeating-radial-gradient(circle, #0e0d0c 0 1.5px, #171512 1.5px 3px);
    box-shadow: 0 26px 50px -18px rgba(0,0,0,.95), inset 0 0 0 1px rgba(var(--gold-rgb), .18), 0 0 0 calc(var(--s) * .012) #0b0a09, 0 0 0 calc(var(--s) * .016) rgba(var(--gold-rgb), .45); }
  body.is-playing .disc { animation-play-state: running; }
  .disc-wrap::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 25deg, transparent 0 7%, rgba(255,240,210,.09) 12%, transparent 19% 50%, rgba(255,240,210,.09) 62%, transparent 69%); }
  .disc-label { position: absolute; inset: 33%; border-radius: 50%; background: #1a160f center / cover no-repeat; box-shadow: 0 0 0 2px rgba(var(--gold-rgb), .8), 0 0 0 4px #0c0b09; }
  .disc-label::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10%; height: 10%; min-width: 4px; min-height: 4px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--gold-grad); box-shadow: 0 0 0 1px #0c0b09; }
  .tonearm { position: absolute; z-index: 4; left: calc(var(--s) * 1.12); top: calc(var(--s) * -.06); width: calc(var(--s) * .38); height: calc(var(--s) * .9); overflow: visible; transform-origin: 78% 11%; transform: rotate(-15deg); transition: transform 1.3s var(--ease) .15s; filter: drop-shadow(0 10px 12px rgba(0,0,0,.6)); pointer-events: none; }
  body.is-playing .tonearm { transform: rotate(0deg); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* home stage */
  .stage { position: relative; display: flex; align-items: center; gap: 64px; margin-top: 56px; padding: 48px 56px; background: linear-gradient(140deg, #13110e, #0b0a08 60%); border: 1px solid var(--line); overflow: hidden; }
  .stage::before { content: ''; position: absolute; inset: 10px; border: 1px solid rgba(var(--gold-rgb), .08); pointer-events: none; }
  .stage::after { content: ''; position: absolute; right: -10%; top: -40%; width: 60%; height: 180%; background: radial-gradient(closest-side, rgba(var(--glow-rgb), .12), transparent); pointer-events: none; transition: background 1.2s; }
  .stage .deck { --s: 220px; }
  .stage-info { min-width: 0; flex: 1; position: relative; z-index: 1; }
  .stage-title { display: block; font-family: var(--serif); font-weight: 300; font-size: clamp(38px, 4.4vw, 62px); line-height: 1; margin: 16px 0 12px; overflow-wrap: anywhere; }
  .stage-artists { color: var(--muted); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }
  .stage .btns { margin-top: 34px; }

  /* buttons */
  .btns { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 28px; border-radius: 999px; font-weight: 500; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; transition: transform .2s, filter .3s, border-color .3s, color .3s, background .3s; white-space: nowrap; }
  .btn .i { width: 16px; height: 16px; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--gold-grad); color: #1a1408; box-shadow: 0 10px 30px -12px rgba(var(--gold-rgb), .55), inset 0 1px 0 rgba(255,255,255,.45); }
  .btn.primary:hover { filter: brightness(1.08) saturate(1.05); }
  .btn.ghost { border: 1px solid var(--line2); color: var(--text); }
  .btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
  .btn.icon { width: 48px; padding: 0; }

  /* detail pages */
  .detail { overflow-x: clip; display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 80px; align-items: start; position: relative; }
  .d-side { position: sticky; top: calc(var(--top) + 16px); }
  .d-side::before { content: ''; position: absolute; z-index: -1; left: -30%; top: -30%; width: 160%; height: 90%; background: radial-gradient(closest-side, rgba(var(--hdr-rgb), .16), transparent); pointer-events: none; transition: background .8s; }
  .d-cover { width: 100%; aspect-ratio: 1; padding: 9px; background: linear-gradient(160deg, #16140f, #0b0a08); border: 1px solid var(--line2); box-shadow: 0 40px 70px -30px rgba(0,0,0,.95); }
  img.d-cover { object-fit: cover; }
  .d-cover.round { border-radius: 50%; }
  .d-side .eyebrow { margin-top: 32px; }
  .d-title { font-family: var(--serif); font-weight: 300; font-size: clamp(38px, 4vw, 56px); line-height: 1; margin: 12px 0 16px; overflow-wrap: anywhere; }
  .d-desc { color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 17px; line-height: 1.5; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .d-meta { color: var(--muted); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; line-height: 2; }
  .d-meta b { color: var(--text); font-weight: 500; }
  .d-side .btns { margin-top: 30px; }
  .d-list { min-width: 0; padding-top: 6px; }
  .d-list .sec:first-child { margin-top: 0; }
  .notice { color: var(--muted); border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 18px; line-height: 1.6; font-family: var(--serif); font-style: italic; font-size: 16px; }
  .fine { color: var(--dim); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; margin-top: 36px; line-height: 2; }

  /* tracks: like an elegant menu */
  .tracks { margin: 0; }
  .tracks.two .rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 48px; }
  .tr { display: grid; grid-template-columns: 40px minmax(0, 1fr) 34px 52px 34px; align-items: center; gap: 12px; padding: 10px 6px; cursor: pointer; color: var(--muted); min-height: 66px; border-bottom: 1px solid rgba(var(--gold-rgb), .08); transition: background .25s; }
  .tr.nonum { grid-template-columns: minmax(0, 1fr) 34px 52px 34px; }
  .tr.nonum .c-num { display: none; }
  .tr:hover { background: linear-gradient(90deg, rgba(var(--gold-rgb), .06), transparent 80%); }
  .c-num { display: flex; justify-content: center; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--dim); }
  .c-num .i, .c-num .eq { display: none; }
  .tr:hover .c-num .n { display: none; }
  .tr:hover .c-num .i { display: block; color: var(--gold); width: 15px; height: 15px; }
  .c-title { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .c-title .cv { width: 46px; height: 46px; box-shadow: 0 0 0 1px var(--line); }
  .c-title > div { min-width: 0; }
  .t-name { color: var(--text); font-family: var(--serif); font-weight: 500; font-size: 19px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-sub { margin-top: 4px; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-sub .dot { margin: 0 8px; color: var(--gold); opacity: .6; }
  .c-dur { text-align: right; font-size: 12px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .e { display: inline-block; border: 1px solid var(--line2); color: var(--gold); font-size: 8.5px; letter-spacing: 0; border-radius: 2px; padding: 0 4px; margin-right: 8px; vertical-align: 1px; line-height: 13px; }
  .tr.playing .t-name { color: var(--gold); }
  .tr.playing .c-num .n { display: none; }
  .tr.playing .c-num .eq { display: flex; }
  .tr.playing:hover .c-num .eq { display: none; }
  .eq { gap: 2px; align-items: flex-end; height: 13px; }
  .eq span { width: 2px; background: var(--gold); animation: eq 1.1s ease-in-out infinite; }
  .eq span:nth-child(2) { animation-delay: -.4s; } .eq span:nth-child(3) { animation-delay: -.7s; }
  body:not(.is-playing) .eq span { animation-play-state: paused; height: 4px; }
  @keyframes eq { 0%,100% { height: 4px } 50% { height: 13px } }

  .icon-btn { display: inline-flex; align-items: center; justify-content: center; color: var(--muted); width: 34px; height: 34px; border-radius: 50%; transition: color .3s, transform .15s; position: relative; }
  .icon-btn:hover { color: var(--gold); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.on { color: var(--gold); }
  .like.on .i { fill: currentColor; }
  .tr .like:not(.on), .tr .more { opacity: 0; }
  .tr:hover .like, .tr:hover .more { opacity: 1; }
  .tr .like .i, .tr .more .i { width: 17px; height: 17px; }

  .chips { display: flex; gap: 28px; flex-wrap: wrap; margin: 34px 0 44px; border-bottom: 1px solid var(--line); }
  .chip { position: relative; padding: 0 0 14px; font-size: 11px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); transition: color .3s; }
  .chip:hover { color: var(--text) !important; }
  .chip::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--gold); transform: scaleX(0); transition: transform .4s var(--ease); }
  .chip.on { color: var(--gold); }
  .chip.on::after { transform: none; }
  .recent-q { display: flex; flex-wrap: wrap; gap: 10px; }
  .recent-q .chip { padding: 9px 18px; border: 1px solid var(--line); border-radius: 999px; }
  .recent-q .chip::after { display: none; }

  /* search */
  .search-field { display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--line2); padding: 8px 0 18px; margin-top: 10px; transition: border-color .4s; }
  .search-field:focus-within { border-color: var(--gold); }
  .search-field > .i { width: 26px; height: 26px; color: var(--gold); }
  .search-field input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-family: var(--serif); font-weight: 300; font-size: clamp(36px, 5.5vw, 64px); line-height: 1.1; }
  .search-field input::placeholder { color: var(--dim); font-style: italic; }
  .best { display: grid; grid-template-columns: minmax(260px, .8fr) minmax(0, 1.4fr); gap: 64px; }
  .best-card { display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; padding: 30px; background: linear-gradient(150deg, #14120e, #0b0a08); border: 1px solid var(--line); cursor: pointer; position: relative; min-height: 300px; transition: border-color .4s; }
  .best-card:hover { border-color: var(--line2); }
  .best-card .cv { width: 120px; height: 120px; box-shadow: 0 0 0 1px var(--line2), 0 20px 40px -18px rgba(0,0,0,.9); }
  .best-card.round .cv { border-radius: 50%; }
  .best-card .nm { font-family: var(--serif); font-weight: 300; font-size: 46px; line-height: 1; overflow-wrap: anywhere; }
  .best-card .sub { color: var(--muted); font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; margin-top: 10px; }
  .best-card .btn { position: absolute; top: 30px; right: 30px; }

  .empty { color: var(--muted); padding: 80px 0; text-align: center; font-size: 14px; line-height: 1.7; }
  .empty b { color: var(--text); display: block; font-family: var(--serif); font-weight: 300; font-size: 38px; margin-bottom: 8px; }

  /* ---------- Popovers / drawer / toast ---------- */
  .pop { position: fixed; z-index: 60; min-width: 250px; max-width: min(340px, calc(100vw - 24px)); background: linear-gradient(170deg, #17150f, #0c0b09); border: 1px solid var(--line2); box-shadow: 0 30px 70px rgba(0,0,0,.75); padding: 8px; animation: pop .2s var(--ease); }

  /* ---------- Now playing ---------- */
  .np { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; overflow: hidden; background: var(--bg);

  /* ---------- Gate ---------- */
  .gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }

  if (!$('.slider.seek.drag')) $$('.t-cur').forEach(e => e.textContent = fmt(pos));
  $$('.t-dur').forEach(e => e.textContent = fmt(dur));
  $('#player').style.setProperty('--p', pct + '%');
}
function paintVolume() {
  $$('.slider.vol').forEach(s => { if (!s.classList.contains('drag')) setSlider(s, P.volume); });
  setIcon($('.vol-btn svg'), P.volume === 0 ? 'mute' : P.volume < 50 ? 'vol1' : 'vol');
}
function setSlider(s, pct) { pct = Math.max(0, Math.min(100, pct)); s.querySelector('.fill').style.width = pct + '%'; s.querySelector('.knob').style.left = pct + '%'; }
function makeSlider(s, onMove, onCommit) {
  const at = e => { const r = s.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 100; };
  s.addEventListener('pointerdown', e => {
    s.setPointerCapture(e.pointerId); s.classList.add('drag');
    const move = ev => { const p = at(ev); setSlider(s, p); onMove?.(p); };
    const up = ev => { s.classList.remove('drag'); s.removeEventListener('pointermove', move); s.removeEventListener('pointerup', up); s.removeEventListener('pointercancel', up); onCommit(at(ev)); };
    s.addEventListener('pointermove', move); s.addEventListener('pointerup', up); s.addEventListener('pointercancel', up);
    move(e);
  });
}
$$('.slider.seek').forEach(s => makeSlider(s, p => $$('.t-cur').forEach(e => e.textContent = fmt(p / 100 * P.duration)), p => seek(p / 100 * P.duration)));
$$('.slider.vol').forEach(s => makeSlider(s, p => setVolume(p), p => setVolume(p, true)));
setInterval(() => { if (P.playing) paintProgress(); if (P.playing && P.duration && curPos() >= P.duration - 50) refreshSoon(700); }, 250);

let pollN = 0;
setInterval(() => { if (!auth.token || document.hidden) return; pollN++; if (!isLocal() || pollN % 5 === 0) refreshPlayer(); }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && auth.token) refreshPlayer(); });

// ---------- Web Playback SDK (plays music right in this browser tab) ----------
window.onSpotifyWebPlaybackSDKReady = () => {
  const player = new Spotify.Player({ name: `${APP} Web Player`, getOAuthToken: cb => auth.access().then(cb).catch(() => {}), volume: (store.get('vol') ?? 70) / 100 });
  sdk.player = player;
  player.addListener('ready', async ({ device_id }) => {
    sdk.deviceId = device_id; sdk.ready = true; sdk.error = null;
    // Grab playback only if nothing is playing anywhere else.
    const cur = await api('/me/player').catch(() => null);
    if (!cur || !cur.device || !cur.is_playing) {
      await api('/me/player', { method: 'PUT', body: { device_ids: [device_id], play: false } }).catch(() => {});
    }
    refreshSoon(600);
  });
  player.addListener('not_ready', () => { sdk.ready = false; });
  player.addListener('player_state_changed', onSdkState);
  player.addListener('initialization_error', ({ message }) => { sdk.error = message; console.warn('SDK', message); });
  player.addListener('authentication_error', ({ message }) => { sdk.error = message; console.warn('SDK auth', message); });
  player.addListener('account_error', () => { sdk.error = 'Premium nötig'; toast('Für die Wiedergabe im Browser ist Spotify Premium nötig.', 5000); });
  player.addListener('playback_error', ({ message }) => console.warn('SDK playback', message));
  player.connect();
};
function loadSdk() {
  const s = document.createElement('script'); s.src = 'https://sdk.scdn.co/spotify-player.js'; s.async = true;
  s.onerror = () => { sdk.error = 'SDK nicht geladen'; };
  document.head.append(s);
}

// ---------- Devices, queue, menus ----------
function closeMenus() { $$('.pop').forEach(p => p.remove()); }
function placePop(pop, anchor) {
  document.body.append(pop);
  const r = anchor.getBoundingClientRect(), pr = pop.getBoundingClientRect();
  const left = Math.min(innerWidth - pr.width - 12, Math.max(12, r.right - pr.width));
  let top = r.top - pr.height - 8; if (top < 12) top = Math.min(innerHeight - pr.height - 12, r.bottom + 8);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
async function openDevices(anchor) {
  closeMenus();
  const pop = document.createElement('div'); pop.className = 'pop';
  pop.innerHTML = '<h4>Abspielen auf …</h4><div class="spinner" style="margin:20px auto"></div>';
  placePop(pop, anchor);
  const d = await api('/me/player/devices').catch(() => ({ devices: [] }));
  const devs = d.devices || [];
  if (sdk.deviceId && !devs.some(x => x.id === sdk.deviceId)) devs.unshift({ id: sdk.deviceId, name: `${APP} Web Player`, type: 'Computer', is_active: isLocal() });
  const ic = t => t === 'Smartphone' ? 'phone' : t === 'Computer' ? 'computer' : 'speaker';
  pop.innerHTML = `<h4>Abspielen auf …</h4>
    ${devs.map(x => `<button class="mi ${x.is_active ? 'on' : ''}" data-dev="${esc(x.id)}">${icon(ic(x.type))}<span>${esc(x.id === sdk.deviceId ? 'Dieser Browser' : x.name)}<small>${x.is_active ? 'Aktiv' : esc(x.type)}</small></span></button>`).join('')}
    <div class="hint">${sdk.deviceId ? '' : (sdk.error ? `Browser-Player nicht verfügbar (${esc(sdk.error)}). ` : 'Browser-Player startet … ')}Öffne Spotify auf Handy, PC oder Lautsprecher, damit es hier erscheint.</div>`;
  placePop(pop, anchor);
  pop.onclick = async e => {
    const b = e.target.closest('[data-dev]'); if (!b) return;
    activateSdk(); closeMenus();
    try { await api('/me/player', { method: 'PUT', body: { device_ids: [b.dataset.dev], play: P.playing || !P.device } }); toast('Gerät gewechselt'); }
    catch (err) { toast(err.message); }
    refreshSoon(800);
  };
}
async function toggleQueue(force) {
  const q = $('#queue'); const open = force ?? !q.classList.contains('open');
  q.classList.toggle('open', open);
  if (!open) return;
  openNP(false);
  const body = $('#queueBody'); body.innerHTML = '<div class="spinner"></div>';
  const d = await api('/me/player/queue').catch(e => ({ error: e }));
  if (d.error) { body.innerHTML = `<div class="empty">${esc(d.error.message)}</div>`; return; }
  const row = (t, now) => t ? `<div class="qi ${now ? 'now' : ''}">${cover(t.album?.images || t.images, 64)}<div class="tx"><div class="nm">${esc(t.name)}</div><div class="sub">${artistLinks(t.artists) || esc(t.show?.name || '')}</div></div></div>` : '';
  body.innerHTML = d.currently_playing ? `<div class="eyebrow lbl">Läuft gerade</div>${row(d.currently_playing, true)}
    <div class="eyebrow lbl">Danach</div>${(d.queue || []).map(t => row(t)).join('') || '<div class="empty" style="padding:20px">Die Warteschlange ist leer.</div>'}`
    : '<div class="empty"><b>Noch nichts geplant</b>Starte einen Song, dann siehst du hier, was als Nächstes kommt.</div>';
}
function openMore(btn) {
  closeMenus();
  const row = btn.closest('.tr'); const t = lists.get(row.closest('[data-list]').dataset.list)?.tracks[+row.dataset.i];
  if (!t) return;
  const pop = document.createElement('div'); pop.className = 'pop';
  const liked = library.cache.get(t.uri);
  pop.innerHTML = `
    <button class="mi" data-m="queue">${icon('plus')}Als Nächstes einreihen</button>
    <button class="mi" data-m="like">${icon('heart')}${liked ? 'Aus Lieblingssongs entfernen' : 'Zu Lieblingssongs hinzufügen'}</button>
    ${t.artists?.[0]?.id ? `<a class="mi" href="#/artist/${esc(t.artists[0].id)}">${icon('user')}Zum Künstler</a>` : ''}
    ${t.album?.id ? `<a class="mi" href="#/album/${esc(t.album.id)}">${icon('disc')}Zum Album</a>` : ''}
    <button class="mi" data-m="link">${icon('link')}Link kopieren</button>`;
  placePop(pop, btn);
  pop.onclick = async e => {
    const m = e.target.closest('[data-m]')?.dataset.m; if (!m && !e.target.closest('a')) return;
    closeMenus();
    if (m === 'queue') { try { await api('/me/player/queue', { method: 'POST', query: { uri: t.uri } }); toast('Wird als Nächstes gespielt'); if ($('#queue').classList.contains('open')) toggleQueue(true); } catch (err) { toast(err.status === 404 ? 'Starte zuerst die Wiedergabe.' : err.message); } }
    if (m === 'like') library.toggle(t.uri);
    if (m === 'link') copy(t.external_urls?.spotify || `https://open.spotify.com/track/${t.id}`);
  };
}
function openUserMenu(btn) {
  closeMenus();
  const pop = document.createElement('div'); pop.className = 'pop';
  pop.innerHTML = `<h4>${esc(me?.display_name || 'Konto')}</h4>
    <button class="mi" data-u="client">${icon('key')}Client-ID ändern</button>
    <button class="mi" data-u="logout">${icon('logout')}Abmelden</button>`;
  placePop(pop, btn);
  pop.onclick = e => {
    const u = e.target.closest('[data-u]')?.dataset.u;
    if (u === 'logout') auth.logout();
    if (u === 'client') { store.del('token'); store.del('clientId'); location.replace(REDIRECT); }
  };
}
function openNP(open) {
  $('#np').classList.toggle('open', open); $('#np').setAttribute('aria-hidden', String(!open));
  if (open && $('#queue').classList.contains('open')) toggleQueue(false);
}

// ---------- Global events ----------
document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest('.pop') && !t.closest('[data-more]') && !t.closest('[data-act="devices"]') && !t.closest('#userBtn')) closeMenus();
  const play = t.closest('[data-play]');
  if (play) { e.preventDefault(); e.stopPropagation(); activateSdk(); if (play.classList.contains('is-on')) actions.toggle(); else playAny(play.dataset.play); return; }
  const shuf = t.closest('[data-shuffle]'); if (shuf) { e.preventDefault(); shufflePlay(shuf.dataset.shuffle); return; }
  const like = t.closest('[data-like]'); if (like) { library.toggle(like.dataset.like); return; }
  const more = t.closest('[data-more]'); if (more) { openMore(more); return; }
  const act = t.closest('[data-act]'); if (act) { actions[act.dataset.act]?.(act); return; }
  if (t.closest('#userBtn')) { openUserMenu($('#userBtn')); return; }
  const link = t.closest('a[href]');
  if (link) { if ($('#np').classList.contains('open')) openNP(false); const hr = link.getAttribute('href'); if (EMBED && hr.startsWith('#/')) { e.preventDefault(); nav(hr); } return; }
  const href = t.closest('[data-href]'); if (href) { nav(href.dataset.href); return; }
  const row = t.closest('.tr[data-i]');
  if (row) { activateSdk(); lists.get(row.closest('[data-list]')?.dataset.list)?.play(+row.dataset.i); return; }
  if (matchMedia('(max-width: 760px)').matches && t.closest('#player') && !t.closest('button')) openNP(true);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === ' ') { e.preventDefault(); actions.toggle(); }
  else if (e.key === 'ArrowRight' && e.shiftKey) actions.next();
  else if (e.key === 'ArrowLeft' && e.shiftKey) actions.prev();
  else if (e.key === 'ArrowRight' && P.item) seek(curPos() + 10000);
  else if (e.key === 'ArrowLeft' && P.item) seek(curPos() - 10000);
  else if (e.key === 'ArrowUp' && e.shiftKey) setVolume(Math.min(100, P.volume + 10));
  else if (e.key === 'ArrowDown' && e.shiftKey) setVolume(Math.max(0, P.volume - 10));
  else if (e.key === '/' || (e.key === 'k' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); nav('#/search'); setTimeout(() => $('#searchInput')?.focus(), 50); }
  else if (e.key === 'Escape') { closeMenus(); openNP(false); toggleQueue(false); }
});
addEventListener('resize', closeMenus);
if ('mediaSession' in navigator) {
  for (const [a, f] of [['play', () => !P.playing && actions.toggle()], ['pause', () => P.playing && actions.toggle()], ['nexttrack', () => actions.next()], ['previoustrack', () => actions.prev()]]) {
    try { navigator.mediaSession.setActionHandler(a, f); } catch {}
  }
}

// ---------- Login / setup screen ----------
function showGate(error = '') {
  $('#app').hidden = true;
  const g = $('#gate'); g.hidden = false;
  const hasId = !!auth.clientId;
  g.innerHTML = `<div class="gate-card">
    <div class="brand"><svg viewBox="0 0 40 40">${LOGO('lgGate')}</svg><span class="wm">SUPREMZ</span></div>
    ${error ? `<div class="err">${esc(error)}</div>` : ''}
    ${hasId ? `<h2>Willkommen <em>zurück</em>.</h2><p>Verbinde dein Spotify-Premium-Konto – deine Playlists, Alben und Lieblingssongs erscheinen dann hier, in deinem eigenen Player.</p>
      <button class="btn primary" id="loginBtn">Mit Spotify verbinden</button>
      <button class="link-btn" id="resetId">Andere Client-ID verwenden</button>`
    : `<h2>Dein privater <em>Hörsalon</em>.</h2><p>${APP} spielt deine Spotify-Musik – in einem Rahmen, der ihr gerecht wird. Einmalig brauchst du dafür eine kostenlose, private „App“ bei Spotify; das dauert etwa zwei Minuten.</p>
      <ol class="steps">
        <li><span>Öffne das <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">Spotify Developer Dashboard</a>, melde dich an und klicke auf <b>Create app</b>.</span></li>
        <li><span>Name und Beschreibung frei wählen. Bei <b>Redirect URIs</b> genau diese Adresse eintragen:
          <div class="copy"><code>${esc(REDIRECT)}</code><button id="copyUri">Kopieren</button></div></span></li>
        <li><span>Bei „Which API/SDKs are you planning to use?“ <b>Web API</b> und <b>Web Playback SDK</b> ankreuzen und speichern.</span></li>
        <li><span>Unter <b>Settings</b> die <b>Client ID</b> kopieren und hier einfügen:</span></li>
      </ol>
      <input class="field" id="cid" placeholder="Client ID (32 Zeichen)" autocomplete="off" spellcheck="false" maxlength="64">
      <button class="btn primary" id="loginBtn" disabled>Speichern &amp; verbinden</button>`}
  </div>`;
  const cid = $('#cid', g), btn = $('#loginBtn', g);
  if (cid) { cid.oninput = () => { btn.disabled = !/^[0-9a-f]{32}$/i.test(cid.value.trim()); }; cid.focus(); }
  $('#copyUri', g)?.addEventListener('click', () => copy(REDIRECT));
  $('#resetId', g)?.addEventListener('click', () => { store.del('clientId'); showGate(); });
  btn.onclick = () => { if (cid) store.set('clientId', cid.value.trim()); btn.disabled = true; btn.textContent = 'Weiterleitung zu Spotify …'; auth.login().catch(e => showGate(e.message)); };
}

// ---------- Boot ----------
async function boot() {
  if (DEMO) { me = await api('/me'); sdk.deviceId = 'demo-web'; $('#demoBadge').hidden = false; return start(); }
  if (location.pathname !== new URL(REDIRECT).pathname) setUrl(REDIRECT + location.search + location.hash);
  try { await auth.handleCallback(); } catch (e) { return showGate(e.message); }
  if (!auth.clientId || !auth.token) return showGate();
  try { me = await api('/me'); }
  catch (e) { if (!(e instanceof AuthError)) showGate(e.status === 403 ? 'Spotify verweigert den Zugriff. Prüfe, ob dein Konto im Developer Dashboard unter „User Management“ eingetragen ist und der App-Besitzer Premium hat.' : e.message); return; }
  loadSdk();
  start();
}
async function start() {
  $('#gate').hidden = true; $('#app').hidden = false;
  const av = $('#userBtn'); const img = pickImg(me.images, 64);
  av.innerHTML = img ? `<img src="${esc(img)}" alt="">` : esc((me.display_name || '?')[0].toUpperCase());
  av.title = me.display_name || 'Konto';
  setAccent(null);
  await Promise.all([loadPlaylists(), refreshPlayer()]);
  route();
}
boot();
</script>
