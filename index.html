<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.H.A.N.O.S.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --c: #b455ff; --c2: #7a1fe0; --bg: #0a0212; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--c); font-family: 'Rajdhani', sans-serif; overflow: hidden; }
  body { background: radial-gradient(ellipse at center, #200a33 0%, var(--bg) 70%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: pointer; }

  /* ---------- Liquid Glass ---------- */
  .glass {
    position: relative;
    background: linear-gradient(155deg, rgba(180,85,255,.16), rgba(255,255,255,.03) 40%, rgba(180,85,255,.06));
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow:
      0 8px 32px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -1px 12px rgba(180,85,255,.12);
    overflow: hidden;
    transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s cubic-bezier(.22,1,.36,1), background .35s;
  }
  .glass::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 28%);
    mix-blend-mode: overlay;
  }
  .glass:active { transform: scale(.96); }

  button.glass {
    cursor: pointer; color: #f3e6ff; font-family: 'Orbitron', sans-serif; letter-spacing: .12em;
    -webkit-user-select: none; user-select: none;
  }
  button.glass:hover {
    background: linear-gradient(155deg, rgba(180,85,255,.28), rgba(255,255,255,.06) 40%, rgba(180,85,255,.14));
    box-shadow: 0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 14px rgba(180,85,255,.22), 0 0 22px rgba(180,85,255,.35);
  }
  button.glass.on {
    background: linear-gradient(155deg, rgba(180,85,255,.5), rgba(255,255,255,.08) 45%, rgba(150,40,255,.3));
    box-shadow: 0 8px 28px rgba(120,20,220,.5), inset 0 1px 0 rgba(255,255,255,.5), 0 0 30px rgba(180,85,255,.55);
  }

  /* ---------- Layout ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .view { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; transition: opacity .4s cubic-bezier(.22,1,.36,1), transform .4s cubic-bezier(.22,1,.36,1); }

  /* Orb view */
  #orbView { justify-content: center; pointer-events: none; }
  .title { font-family: 'Orbitron', sans-serif; font-size: clamp(16px, 3vw, 24px); letter-spacing: .55em; text-shadow: 0 0 14px var(--c); position: absolute; top: max(28px, env(safe-area-inset-top, 0px)); }
  .status { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: .3em; opacity: .75; position: absolute; top: calc(max(28px, env(safe-area-inset-top, 0px)) + 34px); text-align: center; }
  .orb-controls { position: absolute; bottom: max(40px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: auto; }
  .mic-hint { font-size: 12px; opacity: .55; letter-spacing: .05em; }
  .wake-btn { border-radius: 999px; padding: 9px 20px; font-size: 11px; }

  .chat-toggle {
    position: absolute; top: max(24px, env(safe-area-inset-top, 0px)); right: 20px; pointer-events: auto;
    border-radius: 999px; padding: 10px 18px; font-size: 12px; display: flex; align-items: center; gap: 8px;
  }
  .chat-toggle svg { width: 16px; height: 16px; }

  /* Chat view */
  #chatView { opacity: 0; transform: translateY(24px); pointer-events: none; justify-content: flex-end; padding: 0 16px max(16px, env(safe-area-inset-bottom, 0px)); }
  body.chat-open #chatView { opacity: 1; transform: translateY(0); pointer-events: auto; }
  body.chat-open #orbView { opacity: 0; transform: scale(.94); pointer-events: none; }
  #orbView { opacity: 1; }

  .chat-panel { width: min(720px, 100%); max-height: 82vh; border-radius: 28px; display: flex; flex-direction: column; padding: 14px; gap: 12px; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; }
  .chat-header .title2 { font-family: 'Orbitron'; font-size: 13px; letter-spacing: .3em; }
  .close-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .close-btn svg { width: 14px; height: 14px; }

  .log { max-height: 46vh; min-height: 12vh; overflow-y: auto; font-size: 16px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; padding: 4px 2px; }
  .msg { padding: 9px 14px; border-radius: 16px; max-width: 82%; }
  .msg.thanos { align-self: flex-start; background: rgba(180,85,255,.14); border: 1px solid rgba(180,85,255,.25); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-bottom-right-radius: 4px; }
  .msg b { font-family: 'Orbitron'; font-size: 10px; letter-spacing: .2em; opacity: .6; display: block; margin-bottom: 3px; }

  .row { display: flex; gap: 10px; align-items: center; }
  .input-wrap { flex: 1; border-radius: 999px; padding: 4px 4px 4px 18px; display: flex; align-items: center; gap: 8px; }
  input { flex: 1; background: transparent; border: none; color: #f3e6ff; font: inherit; font-size: 16px; outline: none; padding: 10px 0; }
  input::placeholder { color: rgba(243,230,255,.4); }
  .round-btn { width: 44px; height: 44px; min-width: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .round-btn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">

  <div class="view" id="orbView">
    <div class="title">T.H.A.N.O.S.</div>
    <div class="status" id="status">SYSTEM ONLINE</div>

    <button class="glass chat-toggle" id="chatToggle" title="Chat öffnen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4V5z"/></svg>
      CHAT
    </button>

    <div class="orb-controls">
      <div class="mic-hint">Orb antippen oder Leertaste zum Sprechen</div>
      <button class="glass wake-btn" id="wake">FREIHÄNDIG AUS</button>
    </div>
  </div>

  <div class="view" id="chatView">
    <div class="glass chat-panel">
      <div class="chat-header">
        <div class="title2">T.H.A.N.O.S.</div>
        <button class="glass close-btn" id="closeChat" title="Schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="log" id="log"></div>
      <div class="row">
        <div class="glass input-wrap">
          <input id="txt" placeholder="Sag oder schreib deine Aufgabe…" autocomplete="off">
        </div>
        <button class="glass round-btn" id="micChat" title="Sprechen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
        </button>
        <button class="glass round-btn" id="send" title="Senden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>
<script>
// ---------- Orb ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio || 1, 2);
function resize() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();

let state = 'idle';           // idle | listening | thinking | speaking
let energy = 0, target = 0;   // audio/activity level 0..1
const pts = Array.from({ length: 420 }, () => {
  const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2;
  return { x: Math.sqrt(1 - u * u) * Math.cos(t), y: Math.sqrt(1 - u * u) * Math.sin(t), z: u };
});
const colors = { idle: [180, 85, 255], listening: [255, 255, 255], thinking: [255, 170, 0], speaking: [150, 40, 255] };
let col = [180, 85, 255];

function frame(ts) {
  const t = ts / 1000;
  energy += (target - energy) * 0.15;
  const tc = colors[state]; col = col.map((v, i) => v + (tc[i] - v) * 0.05);
  const [r, g, b] = col.map(Math.round), C = (a) => `rgba(${r},${g},${b},${a})`;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.5, R = Math.min(W, H) * 0.46 * (1 + energy * 0.2 + Math.sin(t * 2) * 0.012);

  // glow
  const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.5);
  gr.addColorStop(0, C(0.35 + energy * 0.3)); gr.addColorStop(0.45, C(0.08)); gr.addColorStop(1, C(0));
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, R * 1.5, 0, 7); ctx.fill();

  // rotating HUD rings
  ctx.lineWidth = 1.5;
  [[1.06, 0.4, 0.6], [1.12, -0.25, 0.35], [1.2, 0.12, 0.2]].forEach(([k, sp, a], i) => {
    ctx.strokeStyle = C(a);
    const segs = 6 + i * 6;
    for (let s = 0; s < segs; s++) {
      const a0 = t * sp + (s / segs) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(cx, cy, R * k, a0, a0 + (Math.PI * 2 / segs) * 0.6); ctx.stroke();
    }
  });
  // ticks
  ctx.strokeStyle = C(0.3);
  for (let i = 0; i < 120; i++) {
    const a = (i / 120) * Math.PI * 2 - t * 0.05, l = i % 10 ? 4 : 10;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * R * 1.28, cy + Math.sin(a) * R * 1.28);
    ctx.lineTo(cx + Math.cos(a) * (R * 1.28 + l), cy + Math.sin(a) * (R * 1.28 + l)); ctx.stroke();
  }

  // particle sphere
  const ry = t * 0.35, rx = Math.sin(t * 0.2) * 0.4;
  const cyy = Math.cos(ry), syy = Math.sin(ry), cxx = Math.cos(rx), sxx = Math.sin(rx);
  for (const p of pts) {
    let x = p.x * cyy - p.z * syy, z = p.x * syy + p.z * cyy, y = p.y * cxx - z * sxx; z = p.y * sxx + z * cxx;
    const wob = 1 + energy * 0.18 * Math.sin(t * 8 + p.x * 6 + p.y * 5);
    const s = (z + 2) / 3;
    ctx.fillStyle = C(0.15 + s * 0.75);
    ctx.beginPath(); ctx.arc(cx + x * R * wob, cy + y * R * wob, 0.6 + s * 1.6, 0, 7); ctx.fill();
  }
  // core
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.45);
  core.addColorStop(0, 'rgba(255,255,255,0.9)'); core.addColorStop(0.3, C(0.6)); core.addColorStop(1, C(0));
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx, cy, R * (0.45 + energy * 0.2), 0, 7); ctx.fill();

  if (state === 'speaking') target = 0.4 + Math.random() * 0.6;
  else if (state === 'thinking') target = 0.3 + Math.sin(t * 6) * 0.2;
  else if (state === 'idle') target = 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- UI ----------
const $ = (id) => document.getElementById(id);
const statusEl = $('status'), logEl = $('log'), txt = $('txt'), micChat = $('micChat'), wakeBtn = $('wake');
const chatToggle = $('chatToggle'), closeChat = $('closeChat'), sendBtn = $('send');
const labels = { idle: 'SYSTEM ONLINE', listening: 'LISTENING…', thinking: 'PROCESSING…', speaking: 'RESPONDING' };
function setState(s) {
  state = s; statusEl.textContent = labels[s];
  micChat.classList.toggle('on', s === 'listening');
}
function log(who, text) {
  const d = document.createElement('div'); d.className = 'msg' + (who === 'user' ? ' user' : ' thanos');
  d.innerHTML = `<b>${who === 'user' ? 'SIR' : 'THANOS'}</b>`; d.append(text);
  logEl.append(d); logEl.scrollTop = logEl.scrollHeight;
}

function openChat() { document.body.classList.add('chat-open'); setTimeout(() => txt.focus(), 200); }
function closeChatView() { document.body.classList.remove('chat-open'); }
chatToggle.onclick = openChat;
closeChat.onclick = closeChatView;

// ---------- Voice out ----------
function speakBrowser(text) {
  if (!('speechSynthesis' in window)) return setState('idle');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 1.45; u.pitch = 0.82;
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('de'));
  const v = voices.find(v => /Google/i.test(v.name) && /male|Markus|Yannick|Conrad|Stefan/i.test(v.name))
         || voices.find(v => /Google/i.test(v.name))
         || voices.find(v => /Natural|Online|Neural/i.test(v.name))
         || voices.find(v => /male|Markus|Yannick|Conrad|Stefan/i.test(v.name))
         || voices[0];
  if (v) u.voice = v;
  u.onstart = () => setState('speaking');
  u.onend = u.onerror = () => setState('idle');
  speechSynthesis.speak(u);
}

let ttsAudio = null;
async function speak(text) {
  log('thanos', text);
  speechSynthesis?.cancel();
  try {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error('tts offline');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    ttsAudio?.pause();
    ttsAudio = new Audio(url);
    ttsAudio.onplay = () => setState('speaking');
    ttsAudio.onended = ttsAudio.onerror = () => { setState('idle'); URL.revokeObjectURL(url); };
    await ttsAudio.play();
  } catch {
    speakBrowser(text);
  }
}

// ---------- Brain ----------
// Offline fallback (regelbasiert) – greift, wenn kein Server/Key verfügbar ist.
function localThink(input) {
  const q = input.toLowerCase().trim();
  if (/uhr|zeit/.test(q)) return 'Es ist ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr.';
  if (/datum|welcher tag/.test(q)) return 'Heute ist ' + new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }) + '.';
  if (/hallo|hi |hey|guten/.test(q + ' ')) return 'Guten Tag, Sir. Alle Systeme sind bereit. Welche Aufgabe soll ich übernehmen?';
  if (/wer bist du/.test(q)) return 'Ich bin T.H.A.N.O.S., Ihr persönlicher Assistent.';
  if (/danke/.test(q)) return 'Stets zu Diensten, Sir.';
  return `Verstanden, Sir. Ich kümmere mich um: "${input}".`;
}

// Verlauf für die API (letzte Nachrichten)
const history = [];

async function think(input) {
  history.push({ role: 'user', content: input });
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-20) }),
    });
    if (!res.ok) throw new Error('offline');
    const { text } = await res.json();
    const reply = (text || '').trim();
    if (!reply) throw new Error('empty');
    history.push({ role: 'assistant', content: reply });
    return reply;
  } catch {
    const reply = localThink(input);
    history.push({ role: 'assistant', content: reply });
    return reply;
  }
}

function handle(input) {
  if (!input.trim()) return;
  if (!document.body.classList.contains('chat-open')) openChat();
  log('user', input); setState('thinking');
  think(input).then(speak);
}

// ---------- Voice in ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, wakeOn = false, wakeRec = null;
if (SR) {
  rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = true;
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1]; txt.value = r[0].transcript;
    target = 0.3 + Math.random() * 0.4;
    if (r.isFinal) { const v = txt.value; txt.value = ''; handle(v); }
  };
  rec.onerror = () => setState('idle');
}

// Freihändiger Wake-Word-Modus: hört dauerhaft passiv auf "Thanos, …"
function startWake() {
  if (!SR || wakeRec) return;
  wakeRec = new SR(); wakeRec.lang = 'de-DE'; wakeRec.continuous = true; wakeRec.interimResults = true;
  wakeRec.onresult = (e) => {
    const r = e.results[e.results.length - 1], text = r[0].transcript.toLowerCase();
    if (r.isFinal && /thanos/.test(text)) {
      const cmd = text.split(/thanos[,:]?\s*/i).pop().trim();
      if (cmd) handle(cmd); else listen();
    }
  };
  wakeRec.onend = () => { if (wakeOn) try { wakeRec.start(); } catch {} };
  wakeRec.onerror = () => {};
  try { wakeRec.start(); } catch {}
}
function stopWake() { wakeOn = false; wakeRec?.stop(); wakeRec = null; }
wakeBtn.onclick = () => {
  if (!SR) return speak('Spracherkennung wird von diesem Browser nicht unterstützt.');
  wakeOn = !wakeOn;
  wakeBtn.classList.toggle('on', wakeOn);
  wakeBtn.textContent = wakeOn ? 'FREIHÄNDIG AN' : 'FREIHÄNDIG AUS';
  if (wakeOn) startWake(); else stopWake();
};

// Mikrofonpegel treibt den Orb an, solange zugehört wird
let audioCtx = null, analyser = null, levelData = null, levelStream = null;
async function startLevelMeter() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    levelStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const src = audioCtx.createMediaStreamSource(levelStream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    levelData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    (function tick() {
      if (!analyser) return;
      analyser.getByteFrequencyData(levelData);
      const avg = levelData.reduce((a, b) => a + b, 0) / levelData.length / 255;
      target = Math.min(1, 0.15 + avg * 1.8);
      requestAnimationFrame(tick);
    })();
  } catch { /* Mikrofon-Pegel optional – Spracherkennung läuft trotzdem */ }
}
function stopLevelMeter() {
  analyser = null;
  levelStream?.getTracks().forEach(t => t.stop()); levelStream = null;
}

function listen() {
  if (!rec) return speak('Spracherkennung wird von diesem Browser nicht unterstützt. Bitte Chrome oder Edge verwenden.');
  if (state === 'listening') { rec.stop(); stopLevelMeter(); return; }
  speechSynthesis.cancel(); setState('listening'); target = 0.15;
  startLevelMeter();
  try { rec.start(); } catch {}
}
cv.onclick = listen;
micChat.onclick = listen;
sendBtn.onclick = () => { const v = txt.value; txt.value = ''; handle(v); };
txt.onkeydown = (e) => { if (e.key === 'Enter') { const v = txt.value; txt.value = ''; handle(v); } };
addEventListener('keydown', (e) => { if (e.code === 'Space' && document.activeElement !== txt) { e.preventDefault(); listen(); } });
speechSynthesis?.getVoices();
rec && (rec.onend = () => { if (state === 'listening') setState('idle'); stopLevelMeter(); });

// ---------- Boot-Sequenz ----------
(function boot() {
  const steps = ['INITIALIZING…', 'NEURAL LINK ESTABLISHED', 'SYSTEM ONLINE'];
  let i = 0;
  statusEl.textContent = steps[0];
  const iv = setInterval(() => {
    i++;
    if (i >= steps.length) { clearInterval(iv); statusEl.textContent = labels.idle; return; }
    statusEl.textContent = steps[i];
  }, 650);
})();
</script>
</body>
</html>
