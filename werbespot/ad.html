<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ASICS GEL Spot v2</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =====================================================================
//  ASICS GEL – 30s Spot v2  ·  120 BPM  ·  deterministisch: render(t)
// =====================================================================
const W = 1920, H = 1080, BEAT = 0.5;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
window.cv = cv;
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
const [fxA, fa] = mk(), [fxB, fb] = mk();

const PAL = {
  bone: '#F2ECE4', cream: '#E9E0D2', clay: '#B9A08B', mocha: '#5A4233', espresso: '#2B2019',
  blush: '#E4C1B5', ink: '#13100E', rose: '#B87562'
};
const SANS = '"Inter Display", "Inter", sans-serif';
const SERIF = '"Bitstream Charter", "Caladea", serif';
const MONO = '"JetBrains Mono", monospace';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eBack = x => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hitEnv = (t, h, k) => t >= h ? Math.exp(-(t - h) * k) : 0;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const beatPh = (t, t0) => ((t - t0) % BEAT + BEAT) % BEAT;     // seconds since last beat
const fillAll = c => { ctx.fillStyle = c; ctx.fillRect(-200, -200, W + 400, H + 400); };

function setFont(o) {
  ctx.font = `${o.italic ? 'italic ' : ''}${o.w || 400} ${o.size || 60}px ${o.fam || SANS}`;
  ctx.letterSpacing = (o.ls || 0) + 'px';
}
function tw(s, o) { ctx.save(); setFont(o); const w = ctx.measureText(s).width; ctx.restore(); return w; }
function txt(s, x, y, o = {}) {
  const a = o.a ?? 1; if (a <= 0.001) return;
  ctx.save();
  setFont(o);
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha = clamp(a);
  if (o.comp) ctx.globalCompositeOperation = o.comp;
  if (o.blur && o.blur > 0.2) ctx.filter = `blur(${o.blur}px)`;
  if ((o.align || 'center') === 'center') x += (o.ls || 0) / 2;
  ctx.translate(x, y);
  if (o.sc && o.sc !== 1) ctx.scale(o.sc, o.sc);
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2; ctx.strokeText(s, 0, 0); }
  if (o.fill !== null) { ctx.fillStyle = o.fill || PAL.ink; ctx.fillText(s, 0, 0); }
  ctx.restore();
}
// mask slide-up reveal
function reveal(s, x, y, p, o = {}) {
  if (p <= 0) return;
  const sz = o.size || 100;
  ctx.save(); ctx.beginPath(); ctx.rect(-50, y - sz * 0.82, W + 100, sz * 1.18); ctx.clip();
  txt(s, x, y + (1 - eOut(clamp(p))) * sz * 1.15, o);
  ctx.restore();
}
function typeOn(s, p) { return s.slice(0, Math.floor(clamp(p) * s.length + 0.0001)); }

// ---------- images ----------
const IMG = {};
function load(n, src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[n] = i; res(); }; i.onerror = rej; i.src = src; }); }

// draw cut-out shoe centred at (x,y)
function shoe(x, y, s, rot = 0, o = {}) {
  const img = IMG.cut;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot * Math.PI / 180);
  ctx.scale(s * (o.flip ? -1 : 1), s);
  if (o.filter) ctx.filter = o.filter;
  ctx.globalAlpha = o.a ?? 1;
  if (o.comp) ctx.globalCompositeOperation = o.comp;
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}
// soft contact shadow on the floor (shoe-shaped)
function shadow(x, floorY, s, a = 0.4, spread = 1) {
  const img = IMG.cut;
  ctx.save();
  ctx.translate(x, floorY); ctx.scale(s * 1.08 * spread, s * 0.13);
  ctx.filter = `brightness(0) blur(${10 * spread}px)`;
  ctx.globalAlpha = a;
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
  ctx.save();
  ctx.translate(x, floorY); ctx.scale(1, 0.12);
  const r = 360 * s * spread;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, `rgba(30,18,10,${a * 0.6})`); g.addColorStop(1, 'rgba(30,18,10,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.restore();
}
// shoe point (in cut-out pixel coords) -> screen
function shoePt(px, py, x, y, s, rot = 0, flip = false) {
  const img = IMG.cut;
  let dx = (px - img.width / 2) * s * (flip ? -1 : 1), dy = (py - img.height / 2) * s;
  const r = rot * Math.PI / 180;
  return { x: x + dx * Math.cos(r) - dy * Math.sin(r), y: y + dx * Math.sin(r) + dy * Math.cos(r) };
}
// macro crop of the big photo filling a rect
function macro(cx, cy, cw, t, rect = [0, 0, W, H], drift = [0, 0], filter) {
  const img = IMG.x4;
  const [rx, ry, rw, rh] = rect;
  const sc = rw / cw * (1 + 0.07 * t);
  ctx.save(); ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip();
  ctx.translate(rx + rw / 2, ry + rh / 2); ctx.scale(sc, sc);
  ctx.filter = filter || 'contrast(1.12) saturate(0.85) brightness(0.95) sepia(0.12)';
  ctx.drawImage(img, -(cx + drift[0] * t), -(cy + drift[1] * t));
  ctx.restore();
  // lens vignette / fake DOF
  const v = ctx.createRadialGradient(rx + rw / 2, ry + rh / 2, rh * 0.3, rx + rw / 2, ry + rh / 2, rw * 0.62);
  v.addColorStop(0, 'rgba(10,6,4,0)'); v.addColorStop(1, 'rgba(10,6,4,0.75)');
  ctx.fillStyle = v; ctx.fillRect(rx, ry, rw, rh);
}

// ---------- design elements ----------
function marquee(s, y, size, speed, t, style) {
  ctx.save(); setFont({ w: 900, size, ls: -size * 0.03 });
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const w = ctx.measureText(s).width;
  let x = -(((t * speed) % w) + w) % w;
  for (; x < W + 10; x += w) {
    if (style.stroke) { ctx.strokeStyle = style.stroke; ctx.lineWidth = style.lw || 2; ctx.strokeText(s, x, y); }
    else { ctx.fillStyle = style.fill; ctx.fillText(s, x, y); }
  }
  ctx.restore();
}
function frameBorder(col, inset = 36) {
  ctx.strokeStyle = col; ctx.lineWidth = 1.2;
  ctx.strokeRect(inset, inset, W - 2 * inset, H - 2 * inset);
}
function corners(col, label = {}) {
  const o = { fam: MONO, size: 17, ls: 5, fill: col, w: 500 };
  if (label.tl) txt(label.tl, 66, 70, { ...o, align: 'left' });
  if (label.tr) txt(label.tr, W - 66, 70, { ...o, align: 'right' });
  if (label.bl) txt(label.bl, 66, H - 68, { ...o, align: 'left' });
  if (label.br) txt(label.br, W - 66, H - 68, { ...o, align: 'right' });
}
function viewfinder(col, inset, top, bot) {
  ctx.strokeStyle = col; ctx.lineWidth = 2; const L = 34;
  const pts = [[inset, top, 1, 1], [W - inset, top, -1, 1], [inset, bot, 1, -1], [W - inset, bot, -1, -1]];
  for (const [x, y, sx, sy] of pts) { ctx.beginPath(); ctx.moveTo(x + L * sx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + L * sy); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(W / 2 - 14, (top + bot) / 2); ctx.lineTo(W / 2 + 14, (top + bot) / 2);
  ctx.moveTo(W / 2, (top + bot) / 2 - 14); ctx.lineTo(W / 2, (top + bot) / 2 + 14); ctx.stroke();
}
function leak(t, I, seed = 1) {
  if (I <= 0.002) return;
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const r = rng(seed);
  for (let i = 0; i < 3; i++) {
    const ph = r() * 6.28, sp = 0.3 + r() * 0.5;
    const x = W * (0.5 + 0.55 * Math.sin(t * sp + ph)), y = H * (0.5 + 0.45 * Math.cos(t * sp * 0.7 + ph * 1.3));
    const rad = 500 + 400 * r();
    const col = [[255, 120, 40], [255, 70, 30], [255, 190, 110]][i];
    const fl = 0.75 + 0.25 * Math.sin(t * 23 + i * 2) * Math.sin(t * 7.7 + i);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, `rgba(${col},${0.55 * I * fl})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}
function ruler(y, col, t) {
  ctx.fillStyle = col;
  ctx.fillRect(120, y, W - 240, 1.2);
  for (let i = 0, x = 120; x <= W - 120; x += 24, i++) {
    const h = i % 10 === 0 ? 18 : i % 5 === 0 ? 11 : 6;
    ctx.fillRect(x, y - h, 1.2, h);
    if (i % 10 === 0) txt(String(i * 2).padStart(3, '0'), x + 6, y - 26, { fam: MONO, size: 13, ls: 2, fill: col, align: 'left' });
  }
}

// ---------- frame FX ----------
function rgbSplit(d) {
  if (d < 0.6) return;
  fa.globalCompositeOperation = 'copy'; fa.drawImage(cv, 0, 0);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none';
  ctx.globalCompositeOperation = 'copy'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const [col, dx, dy] of [['#f00', -d, 0], ['#0f0', 0, 0], ['#00f', d, d * 0.3]]) {
    fb.globalCompositeOperation = 'copy'; fb.drawImage(fxA, 0, 0);
    fb.globalCompositeOperation = 'multiply'; fb.fillStyle = col; fb.fillRect(0, 0, W, H);
    ctx.drawImage(fxB, dx, dy);
  }
  ctx.restore();
}
function glitch(amt, seed, n = 9) {
  if (amt < 1) return;
  fa.globalCompositeOperation = 'copy'; fa.drawImage(cv, 0, 0);
  const r = rng(seed);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < n; i++) {
    const y = r() * H, h = 6 + r() * 90, dx = (r() - 0.5) * 2 * amt;
    ctx.drawImage(fxA, 0, y, W, h, dx, y, W, h);
  }
  ctx.restore();
}
function invert() {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function flash(a, col = '255,250,240') { if (a > 0.003) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(${col},${clamp(a)})`; ctx.fillRect(0, 0, W, H); ctx.restore(); } }

const grainC = [];
(function () {
  const r = rng(42);
  for (let k = 0; k < 10; k++) {
    const [c, g] = mk(960, 540); const id = g.createImageData(960, 540);
    for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() + r() - 1) * 150; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0); grainC.push(c);
  }
})();

// =====================================================================
//  S1  0–6  Intro (Cinemascope)
// =====================================================================
const BAR = 138;
const MACROS = [
  { cx: 650, cy: 360, cw: 560, dr: [-30, 6], label: '01 — SCHNÜRUNG' },
  { cx: 245, cy: 330, cw: 520, dr: [25, 0], label: '02 — FERSE' },
  { cx: 500, cy: 690, cw: 600, dr: [40, -6], label: '03 — GEL-DÄMPFUNG' },
  { cx: 770, cy: 650, cw: 560, dr: [-20, -10], label: '04 — SILHOUETTE' },
];
function s1(t) {
  fillAll(PAL.ink);
  if (t < 1) {
    leak(t + 3, 0.35 * seg(t, 0, 0.7), 3);
    const s = 'ASICS  —  GEL';
    txt(typeOn(s, seg(t, 0.12, 0.7)) + (Math.floor(t * 5) % 2 ? '_' : ' '), W / 2, H / 2, { fam: MONO, size: 22, ls: 9, fill: '#EADCC8', w: 500 });
  } else if (t < 3) {
    const i = Math.floor((t - 1) / BEAT), u = (t - 1 - i * BEAT) / BEAT;
    const m = MACROS[i];
    macro(m.cx, m.cy, m.cw, u, [0, 0, W, H], m.dr);
    viewfinder('rgba(242,236,228,0.75)', 70, BAR + 40, H - BAR - 40);
    txt(m.label, 110, H - BAR - 82, { fam: MONO, size: 19, ls: 6, fill: '#F2ECE4', align: 'left', w: 500 });
    txt(`${i + 1} / 4`, W - 110, H - BAR - 82, { fam: MONO, size: 19, ls: 6, fill: '#F2ECE4', align: 'right', w: 500 });
    txt('ASICS GEL', W - 110, BAR + 82, { fam: MONO, size: 17, ls: 6, fill: 'rgba(242,236,228,0.7)', align: 'right', w: 500 });
    const rec = Math.floor(t * 4) % 2;
    ctx.fillStyle = `rgba(214,60,40,${rec ? 0.95 : 0.25})`; ctx.beginPath(); ctx.arc(118, BAR + 82, 6, 0, 7); ctx.fill();
    txt('REC', 136, BAR + 82, { fam: MONO, size: 17, ls: 4, fill: 'rgba(242,236,228,0.8)', align: 'left', w: 500 });
  } else if (t < 5) {
    fillAll(PAL.cream);
    const X = 210, sz = 148;
    reveal('Die Stadt hat', X, H * 0.36, seg(t, 3.0, 3.35), { w: 900, size: sz, ls: -5, align: 'left', fill: PAL.ink });
    reveal('ihren eigenen', X, H * 0.36 + sz * 1.0, seg(t, 3.5, 3.85), { w: 900, size: sz, ls: -5, align: 'left', fill: PAL.ink });
    reveal('Takt.', X - 4, H * 0.36 + sz * 2.05, seg(t, 4.0, 4.35), { fam: SERIF, italic: true, w: 400, size: sz * 1.12, ls: -2, align: 'left', fill: PAL.rose });
    // small product, enters on beat
    const e = eOut(seg(t, 4.0, 4.45));
    if (e > 0) {
      const x = lerp(W + 300, W * 0.77, e), y = H * 0.58 + Math.sin(t * 2) * 6;
      shadow(x, H * 0.58 + 210, 0.5, 0.35 * e);
      shoe(x, y, 0.5, -8);
    }
    txt('(01)', 110, BAR + 70, { fam: MONO, size: 17, ls: 5, fill: PAL.mocha, align: 'left', w: 500 });
    txt('ASICS GEL', W - 110, BAR + 70, { fam: MONO, size: 17, ls: 5, fill: PAL.mocha, align: 'right', w: 500 });
    ctx.fillStyle = 'rgba(90,66,51,0.35)'; ctx.fillRect(110, H - BAR - 70, W - 220, 1);
  } else {
    fillAll(PAL.ink);
    const words = ['Du', 'hast', 'deinen.'], at = [5.0, 5.25, 5.5];
    const zoom = eIn(seg(t, 5.75, 6.0));
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1 + zoom * 2.5, 1 + zoom * 2.5); ctx.translate(-W / 2, -H / 2);
    const o = { w: 900, size: 190, ls: -6, fill: PAL.bone };
    const full = words.join(' ');
    const total = tw(full, o);
    let x = W / 2 - total / 2;
    for (let i = 0; i < 3; i++) {
      const wi = tw(words[i] + ' ', o);
      const k = seg(t, at[i], at[i] + 0.1);
      if (k > 0) {
        const fam = i === 2 ? { ...o, fam: SERIF, italic: true, w: 400, fill: PAL.blush, size: 210, ls: -2 } : o;
        txt(words[i], x, H / 2 + (1 - eOut(k)) * 40, { ...fam, align: 'left', a: k, blur: zoom * 20 });
      }
      x += wi;
    }
    ctx.restore();
  }
}
function letterbox(t) {
  let bh = BAR;
  if (t >= 6) bh = BAR * (1 - eOut(seg(t, 6.0, 6.4)));
  if (t >= 6.4) return;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bh); ctx.fillRect(0, H - bh, W, bh);
}

// =====================================================================
//  S2  6–12  Hero / Marquee / Farbblöcke
// =====================================================================
const S2B = [
  { bg: PAL.mocha, fg: PAL.bone, mq: 'rgba(242,236,228,0.09)', mqs: 'rgba(242,236,228,0.22)' },
  { bg: PAL.cream, fg: PAL.ink, mq: 'rgba(90,66,51,0.10)', mqs: 'rgba(90,66,51,0.28)' },
  { bg: PAL.blush, fg: PAL.ink, mq: 'rgba(255,255,255,0.28)', mqs: 'rgba(120,60,45,0.25)' },
];
function heroPose2(t) {
  const bar = t < 8 ? 0 : t < 10 ? 1 : 2;
  let x = W / 2, y = H * 0.47, s = 1.0, rot = -6, flip = false;
  if (bar === 0) {
    const e = seg(t, 6.0, 6.32);
    y = lerp(-650, H * 0.47, eBack(e)); rot = lerp(-28, -6, eOut(e));
    rot += Math.sin((t - 6) * 1.6) * 2.5;
  } else if (bar === 1) { flip = true; rot = 9 + Math.sin((t - 8) * 1.4) * 2; s = 1.1; x = W * 0.5; }
  else { rot = -16 + Math.sin((t - 10) * 1.6) * 2; s = 0.96; x = W * 0.5 + (t - 10) * 10; }
  y += Math.sin(t * 2.4) * 10;
  s *= 1 + 0.035 * Math.exp(-beatPh(t, 6) * 12);
  return { x, y, s, rot, flip };
}
function s2(t) {
  const bar = t < 8 ? 0 : t < 10 ? 1 : 2, B = S2B[bar];
  fillAll(B.bg);
  const sp = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, 1100);
  sp.addColorStop(0, 'rgba(255,255,255,0.10)'); sp.addColorStop(1, 'rgba(0,0,0,0.18)');
  ctx.fillStyle = sp; ctx.fillRect(0, 0, W, H);
  marquee('ASICS GEL — ', H * 0.17, 290, 260, t, { fill: B.mq });
  marquee('KOMFORT — STIL — ', H * 0.5, 290, -330, t, { stroke: B.mqs, lw: 2 });
  marquee('ASICS GEL — ', H * 0.83, 290, 260, t + 1.7, { fill: B.mq });
  const p = heroPose2(t);
  const floor = H * 0.47 + 0.5 * 783 * p.s + 10;
  shadow(p.x, floor, p.s, 0.45 * seg(t, 6.15, 6.35), 1 + Math.sin(t * 2.4) * 0.04);
  if (t < 6.5) for (let k = 4; k >= 1; k--) { const q = heroPose2(t - k * 0.025); shoe(q.x, q.y, q.s, q.rot, { flip: q.flip, a: 0.18 * (1 - k / 5) }); }
  if (bar === 2) for (let k = 3; k >= 1; k--) { const q = heroPose2(t - k * 0.06); shoe(q.x - k * 26, q.y, q.s, q.rot, { flip: q.flip, a: 0.12 * (1 - k / 4) }); }
  shoe(p.x, p.y, p.s, p.rot, { flip: p.flip });
  // editorial furniture
  frameBorder(bar === 0 ? 'rgba(242,236,228,0.25)' : 'rgba(43,32,25,0.25)');
  const words = ['KOMFORT', 'STIL', 'HALTUNG'];
  const act = Math.floor((t - 6) / BEAT) % 3;
  words.forEach((w, i) => txt(w, W - 90, H * 0.43 + i * 40, { fam: MONO, size: 20, ls: 7, w: 600, align: 'right', fill: B.fg, a: i === act ? 1 : 0.28 }));
  corners(B.fg, { tl: 'ASICS', tr: 'N° 02', bl: 'GEL — SERIES', br: '120 BPM' });
  txt('↘', 90, H * 0.5, { fam: SANS, size: 40, w: 300, fill: B.fg, align: 'left' });
}

// =====================================================================
//  S3  12–18  Triptychon + Datenblatt
// =====================================================================
const PANELS = [
  { bg: PAL.cream, fg: PAL.ink, sub: PAL.rose, fp: [100, 345], s: 1.9, dr: [18, -10], n: '01', title: 'GEL-DÄMPFUNG', text: 'Weich bei jedem Schritt.' },
  { bg: PAL.clay, fg: PAL.ink, sub: PAL.bone, fp: [420, 400], s: 1.75, dr: [-20, 8], n: '02', title: 'SCHICHT FÜR SCHICHT', text: 'Mehrlagiges Obermaterial.' },
  { bg: PAL.mocha, fg: PAL.bone, sub: PAL.blush, fp: [560, 320], s: 1.8, dr: [10, 14], n: '03', title: 'RETRO-RUNNER-DNA', text: 'Ikonische Linien.' },
];
const CALLOUTS = [
  { p: [95, 350], at: 15.5, lx: 150, ly: H * 0.27, side: 'L', title: 'GEL-TECHNOLOGIE', text: 'Dämpfung in der Ferse' },
  { p: [545, 300], at: 16.0, lx: W - 150, ly: H * 0.22, side: 'R', title: 'SCHNÜRUNG', text: 'Sicherer, fester Sitz' },
  { p: [650, 700], at: 16.5, lx: W - 150, ly: H * 0.80, side: 'R', title: 'AUSSENSOHLE', text: 'Grip für die Stadt' },
];
function s3(t) {
  if (t < 15) {
    fillAll(PAL.ink);
    PANELS.forEach((P, i) => {
      const inP = eOut(seg(t, 12 + i * 0.12, 12.45 + i * 0.12));
      const outP = eIn(seg(t, 14.55 + i * 0.1, 14.95 + i * 0.1));
      const x0 = i * 640, y0 = (1 - inP) * H - outP * H;
      ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, 640, H); ctx.clip();
      ctx.fillStyle = P.bg; ctx.fillRect(x0, y0, 640, H);
      const u = t - 12;
      const cx = x0 + 320 + P.dr[0] * u, cy = y0 + H * 0.42 + P.dr[1] * u;
      const img = IMG.cut;
      const sx = cx - (P.fp[0] - img.width / 2) * P.s, sy = cy - (P.fp[1] - img.height / 2) * P.s;
      shoe(sx, sy, P.s * (1 + 0.03 * u), 0);
      // label block
      const ly = y0 + H - 250;
      const g = ctx.createLinearGradient(0, ly - 120, 0, y0 + H);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, P.bg);
      ctx.fillStyle = g; ctx.fillRect(x0, ly - 120, 640, 370);
      txt(P.n, x0 + 56, y0 + 80, { fam: MONO, size: 20, ls: 5, w: 600, fill: P.fg, align: 'left' });
      ctx.fillStyle = P.fg; ctx.globalAlpha = 0.5; ctx.fillRect(x0 + 56, y0 + 104, 40, 1.5); ctx.globalAlpha = 1;
      const lp = seg(t, 12.6 + i * 0.25, 13.0 + i * 0.25);
      reveal(P.title, x0 + 56, ly + 60, lp, { w: 900, size: 46, ls: -1, fill: P.fg, align: 'left' });
      reveal(P.text, x0 + 56, ly + 120, seg(t, 12.8 + i * 0.25, 13.2 + i * 0.25), { fam: SERIF, italic: true, size: 38, fill: P.sub, align: 'left' });
      ctx.restore();
      if (i > 0) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x0, y0, 1.5, H); }
    });
  } else {
    fillAll(PAL.bone);
    const out = eIn(seg(t, 17.5, 18.0));
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(1 + out * 0.5, 1 + out * 0.5); ctx.translate(-W / 2, -H / 2);
    if (out > 0) ctx.filter = `blur(${out * 12}px)`;
    // grid
    ctx.fillStyle = 'rgba(90,66,51,0.07)';
    for (let x = 0; x < W; x += 80) ctx.fillRect(x, 0, 1, H);
    for (let y = 0; y < H; y += 80) ctx.fillRect(0, y, W, 1);
    const e = eOut(seg(t, 15.0, 15.45));
    const sx = W / 2, sy = H * 0.5 + Math.sin(t * 2) * 5, s = lerp(1.25, 0.92, e), rot = lerp(4, 0, e);
    shadow(sx, H * 0.5 + 0.5 * 783 * s + 12, s, 0.35);
    shoe(sx, sy, s, rot);
    for (const c of CALLOUTS) {
      const k = seg(t, c.at, c.at + 0.3);
      if (k <= 0) continue;
      const pt = shoePt(c.p[0], c.p[1], sx, sy, s, rot);
      const ax = c.side === 'L' ? c.lx + 330 : c.lx - 330, ay = c.ly + 34;
      const k1 = eOut(clamp(k * 1.6)), k2 = eOut(clamp(k * 1.6 - 0.6));
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(lerp(pt.x, ax, k1), lerp(pt.y, ay, k1)); ctx.stroke();
      if (k2 > 0) { ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lerp(ax, c.lx, k2), ay); ctx.stroke(); }
      ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.arc(pt.x, pt.y, 5, 0, 7); ctx.fill();
      const pr = (t - c.at) % 1.2;
      ctx.strokeStyle = `rgba(184,117,98,${1 - pr / 1.2})`; ctx.beginPath(); ctx.arc(pt.x, pt.y, 8 + pr * 30, 0, 7); ctx.stroke();
      const al = c.side === 'L' ? 'left' : 'right';
      txt(typeOn(c.title, seg(t, c.at + 0.15, c.at + 0.45)), c.lx, c.ly, { w: 800, size: 28, ls: 4, fill: PAL.ink, align: al });
      txt(typeOn(c.text, seg(t, c.at + 0.3, c.at + 0.7)), c.lx, c.ly + 72, { fam: SERIF, italic: true, size: 36, fill: PAL.rose, align: al });
    }
    ruler(H - 100, 'rgba(43,32,25,0.55)', t);
    txt('TECHNISCHE DATEN', 66, 70, { fam: MONO, size: 17, ls: 5, w: 600, fill: PAL.ink, align: 'left' });
    txt('ASICS GEL — N° 03', W - 66, 70, { fam: MONO, size: 17, ls: 5, w: 600, fill: PAL.ink, align: 'right' });
    ctx.restore();
  }
}

// =====================================================================
//  S4  18–24  Raster / Tageszeiten / Schnittgewitter
// =====================================================================
const GRIDC = [PAL.cream, PAL.clay, PAL.mocha, PAL.blush];
const DAY = [
  { w: 'MORGENS.', bg: PAL.cream, fg: PAL.ink, time: '07:30', p: { x: .5, y: .56, s: .82, rot: -12, flip: false } },
  { w: 'MITTAGS.', bg: PAL.clay, fg: PAL.ink, time: '13:00', p: { x: .5, y: .54, s: .86, rot: 10, flip: true } },
  { w: 'ABENDS.', bg: PAL.mocha, fg: PAL.bone, time: '19:45', p: { x: .5, y: .57, s: .84, rot: -24, flip: false } },
  { w: 'NACHTS.', bg: PAL.ink, fg: PAL.bone, time: '00:15', p: { x: .5, y: .55, s: .9, rot: 4, flip: true } },
];
const CUTS = ['m0', 'h1', 'm1', 'h2', 'm2', 'h3', 'h4', 'black'];
function s4(t) {
  if (t < 20) {
    const shift = t >= 19 ? 1 : 0;
    for (let j = 0; j < 3; j++) for (let i = 0; i < 4; i++) {
      const idx = (i + j * 4), d = (i + j) * 0.05;
      const pop = eBack(seg(t, 18 + d, 18.35 + d));
      const pulse = Math.exp(-beatPh(t - d, 18) * 9) * 0.06;
      const x = i * 480, y = j * 360;
      ctx.fillStyle = GRIDC[(i + j + shift * 2) % 4]; ctx.fillRect(x, y, 480, 360);
      const s = 0.31 * pop * (1 + pulse);
      if (s > 0.01) shoe(x + 240, y + 175, s, Math.sin(t * 3 + idx) * 9 + (idx % 2 ? 6 : -10), { flip: (idx + shift) % 2 === 1 });
    }
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let i = 1; i < 4; i++) ctx.fillRect(i * 480, 0, 1, H);
    for (let j = 1; j < 3; j++) ctx.fillRect(0, j * 360, W, 1);
    if (t >= 19.0) {
      const k = eOut(seg(t, 19.0, 19.25));
      const bh = 300 * k;
      ctx.fillStyle = PAL.ink; ctx.fillRect(0, H / 2 - bh / 2, W, bh);
      ctx.save(); ctx.beginPath(); ctx.rect(0, H / 2 - bh / 2, W, bh); ctx.clip();
      txt('ÜBERALL.', W / 2 - 400 * (t - 19), H / 2 + 8, { w: 900, size: 270, ls: -10, fill: PAL.bone });
      txt('ASICS GEL', W - 90, H / 2 + 120, { fam: MONO, size: 17, ls: 6, fill: PAL.blush, align: 'right', w: 600 });
      ctx.restore();
    }
  } else if (t < 22) {
    const i = Math.min(3, Math.floor((t - 20) / BEAT)), D = DAY[i], u = t - 20 - i * BEAT;
    fillAll(D.bg);
    const k = eOut(seg(u, 0, 0.12));
    txt(D.w, W / 2, H * 0.47, { w: 900, size: 300, ls: -12, fill: D.fg, sc: lerp(1.12, 1, k) });
    const p = D.p, mv = u * 60;
    const x = W * p.x + (p.flip ? -mv : mv), y = H * p.y;
    for (let e = 3; e >= 1; e--) shoe(x - (p.flip ? -1 : 1) * e * 30, y, W * 0 + p.s, p.rot, { flip: p.flip, a: 0.12 * (1 - e / 4) });
    shadow(x, y + 0.5 * 783 * p.s + 30, p.s, 0.4);
    shoe(x, y, p.s, p.rot, { flip: p.flip });
    corners(D.fg, { tl: D.time, tr: 'ASICS GEL', bl: `0${i + 1} / 04`, br: 'DEIN TAG' });
  } else {
    const i = Math.min(7, Math.floor((t - 22) / 0.25)), u = (t - 22 - i * 0.25) / 0.25, c = CUTS[i];
    if (c[0] === 'm') { const m = MACROS[[0, 2, 3][+c[1]]]; macro(m.cx, m.cy, m.cw * 0.9, u, [0, 0, W, H], m.dr); }
    else if (c === 'black') { fillAll('#000'); }
    else {
      const v = { h1: [PAL.blush, -10, false, 1.1], h2: [PAL.mocha, 14, true, 1.2], h3: [PAL.cream, -4, false, 1.0], h4: [PAL.clay, -20, true, 1.25] }[c];
      fillAll(v[0]);
      if (c === 'h3') txt('GEL', W / 2, H / 2, { w: 900, size: 640, ls: -20, fill: null, stroke: PAL.mocha, lw: 3 });
      if (c === 'h2') marquee('ASICS GEL — ', H / 2, 330, -900, t, { fill: 'rgba(242,236,228,0.12)' });
      const z = 1 + (1 - eOut(u)) * 0.12;
      const jit = c === 'h4' ? Math.sin(t * 90) * 14 : 0;
      shoe(W / 2 + jit, H * 0.5, v[3] * z, v[1], { flip: v[2] });
    }
  }
}

// =====================================================================
//  S5  24–30  Endcard
// =====================================================================
function s5(t) {
  fillAll(PAL.bone);
  const sp = ctx.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.38, 1000);
  sp.addColorStop(0, 'rgba(255,255,255,0.5)'); sp.addColorStop(1, 'rgba(185,160,139,0.25)');
  ctx.fillStyle = sp; ctx.fillRect(0, 0, W, H);
  const e = eOut(seg(t, 24.0, 25.3));
  const s = lerp(1.3, 0.68, e), rot = lerp(-14, -5, e), x = W / 2, y = H * 0.38 + Math.sin((t - 24) * 1.5) * 7;
  shadow(x, H * 0.38 + 0.5 * 783 * 0.68 + 26, s, 0.35 * e, 1 + Math.sin((t - 24) * 1.5) * 0.03);
  shoe(x, y, s, rot);
  frameBorder('rgba(43,32,25,0.22)');
  // wordmark
  const wk = seg(t, 24.8, 25.25);
  const ls = lerp(40, 6, eOut(seg(t, 24.8, 25.8)));
  const o1 = { w: 900, size: 120, ls };
  const o2 = { w: 900, size: 120, ls, italic: true };
  const w1 = tw('ASICS', o1), w2 = tw('GEL', o2), gap = 70;
  const x0 = W / 2 - (w1 + gap + w2) / 2, wy = H * 0.755;
  reveal('ASICS', x0, wy, wk, { ...o1, align: 'left', fill: PAL.ink });
  reveal('GEL', x0 + w1 + gap, wy, wk, { ...o2, align: 'left', fill: PAL.rose });
  const lk = eOut(seg(t, 25.0, 25.4));
  ctx.fillStyle = PAL.ink; ctx.fillRect(x0 + w1 + gap / 2 - 1, wy - 50 * lk, 2, 100 * lk);
  // tagline
  const t1 = 'Komfort, der ', t2 = 'auffällt.';
  const a1 = { w: 500, size: 46, ls: -0.5 }, a2 = { fam: SERIF, italic: true, size: 52 };
  const tw1 = tw(t1, a1), tw2 = tw(t2, a2), tx = W / 2 - (tw1 + tw2) / 2, ty = H * 0.86;
  reveal(t1, tx, ty, seg(t, 25.6, 25.95), { ...a1, align: 'left', fill: PAL.ink });
  reveal(t2, tx + tw1, ty, seg(t, 25.75, 26.1), { ...a2, align: 'left', fill: PAL.rose });
  txt('JETZT ERHÄLTLICH', W / 2, H * 0.925, { fam: MONO, size: 17, ls: 8, w: 500, fill: PAL.mocha, a: seg(t, 26.4, 26.9) });
  corners('rgba(43,32,25,0.7)', { tl: 'ASICS', tr: 'GEL', bl: 'N° 04', br: '—' });
}

// =====================================================================
//  master
// =====================================================================
function shakeAt(t) {
  let x = 0, y = 0;
  for (const [h, a, k] of [[6, 28, 7], [18, 16, 8], [24, 18, 6], [8, 8, 12], [10, 8, 12]]) { const e = hitEnv(t, h, k) * a; x += e * Math.sin(t * 97 + h); y += e * Math.sin(t * 133 + h); }
  if (t > 6 && t < 12) { const e = Math.exp(-beatPh(t, 6) * 18) * 3; y += e * Math.sin(t * 150); }
  return { x: x + Math.sin(t * 7.3) * 0.9, y: y + Math.sin(t * 5.1 + 1) * 0.9 };
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  fillAll('#000');
  const sh = shakeAt(t);
  ctx.save(); ctx.translate(sh.x, sh.y);
  if (t < 6) s1(t); else if (t < 12) s2(t); else if (t < 18) s3(t); else if (t < 24) s4(t); else s5(t);
  ctx.restore();
  letterbox(t);

  // light leaks
  leak(t, 0.6 * hitEnv(t, 6, 2.5) + 0.45 * hitEnv(t, 24, 1.4) + 0.25 * hitEnv(t, 12, 4) + 0.2 * hitEnv(t, 18, 3), 7);
  // flashes on cuts
  let fl = 0;
  for (const c of [1, 1.5, 2, 2.5, 3, 5, 8, 10, 12, 15, 20, 20.5, 21, 21.5]) fl += 0.55 * hitEnv(t, c, 30);
  for (let c = 22; c < 23.8; c += 0.25) fl += 0.4 * hitEnv(t, c, 40);
  fl += hitEnv(t, 6, 6) + 0.9 * hitEnv(t, 18, 7);
  if (t > 5.85 && t < 6) fl += Math.pow(seg(t, 5.85, 6), 2);
  if (t > 17.85 && t < 18) fl += Math.pow(seg(t, 17.85, 18), 2) * 0.8;
  flash(fl);
  flash(0.9 * hitEnv(t, 24, 5), '255,236,215');
  // glitch + rgb split
  let gl = 0, rs = 0;
  for (const c of [1, 1.5, 2, 2.5, 8, 10, 15]) { gl += 50 * hitEnv(t, c, 25); rs += 9 * hitEnv(t, c, 18); }
  for (let c = 22; c < 23.8; c += 0.25) { gl += 70 * hitEnv(t, c, 22); rs += 12 * hitEnv(t, c, 16); }
  gl += 80 * hitEnv(t, 6, 10) + 60 * hitEnv(t, 18, 12);
  rs += 22 * hitEnv(t, 6, 6) + 14 * hitEnv(t, 18, 7) + 10 * hitEnv(t, 24, 6) + 18 * seg(t, 5.6, 6) * (t < 6);
  if (t > 23.5 && t < 23.75) { gl += 40; rs += 10; }
  glitch(gl, Math.floor(t * 30), 10);
  rgbSplit(rs);
  if ((t >= 23.5 && t < 23.75 && Math.floor(t * 30) % 3 === 0) || (t >= 19.0 && t < 19.06)) invert();

  // grain + vignette + fade
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.16;
  ctx.drawImage(grainC[Math.floor(t * 30) % grainC.length], 0, 0, W, H);
  ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.1);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,5,0,0.38)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const f = 1 - seg(t, 0, 0.3) * (1 - seg(t, 29.2, 29.95));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;

Promise.all([
  load('cut', 'assets/shoe_cut.png'), load('x4', 'assets/shoe_x4.png'),
  document.fonts.load(`900 100px "Inter Display"`), document.fonts.load(`italic 900 100px "Inter Display"`),
  document.fonts.load(`500 100px "Inter Display"`), document.fonts.load(`800 100px "Inter Display"`),
  document.fonts.load(`italic 400 100px "Bitstream Charter"`), document.fonts.load(`500 40px "JetBrains Mono"`),
  document.fonts.load(`600 40px "JetBrains Mono"`),
]).then(() => { render(0); window.ready = true; }).catch(e => { console.error('load failed', e); });

if (location.search.includes('play')) { const t0 = performance.now(); const loop = () => { if (window.ready) render(((performance.now() - t0) / 1000) % 30); requestAnimationFrame(loop); }; loop(); }
</script>
